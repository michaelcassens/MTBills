name: Bill Watch

on:
  schedule:
    - cron: "17 */4 * * *"        # every 4 hours (UTC); tighten during session if you like
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  push:
    paths: ["data/inbox/**"]       # run as soon as you upload a new CSV export

permissions:
  contents: write

concurrency:
  group: billwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect, screen, alert, publish feed
        run: python billwatch.py run --send
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          BILLWATCH_NTFY_TOPIC: ${{ secrets.BILLWATCH_NTFY_TOPIC }}
          BILLWATCH_NTFY_TOKEN: ${{ secrets.BILLWATCH_NTFY_TOKEN }}
          BILLWATCH_SMTP_PASSWORD: ${{ secrets.BILLWATCH_SMTP_PASSWORD }}
      - name: Save database and feed
        run: |
          git config user.name "bill-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/billwatch.db data/inbox docs/feed.json
          git diff --cached --quiet || git commit -m "Bill Watch update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
